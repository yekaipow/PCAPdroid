name: Release build

# Only builds the official (release) variant, signed with the fixed certificate.
on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build signed release APK
        # assembleStandardRelease = release build type only (no debug variants)
        run: ./gradlew assembleStandardRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/standard/release/app-standard-release.apk"
          test -f "$APK" || APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PCAPdroid-release
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
